<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="This site has moved to dhurba.net. You will be redirected to the new domain.">

  <title>Website moved to dhurba.net</title>

  <style>
    :root {
      --ink: #18202f;
      --muted: #5c6575;
      --paper: #fbf7ef;
      --panel: rgba(255, 255, 255, 0.84);
      --teal: #1e8a8a;
      --teal-dark: #106466;
      --coral: #d85d46;
      --gold: #d8a835;
      --line: rgba(24, 32, 47, 0.14);
      --shadow: 0 24px 70px rgba(24, 32, 47, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.5;
      background:
        linear-gradient(115deg, rgba(30, 138, 138, 0.14), transparent 32%),
        linear-gradient(245deg, rgba(216, 93, 70, 0.12), transparent 38%),
        repeating-linear-gradient(
          90deg,
          rgba(24, 32, 47, 0.045) 0 1px,
          transparent 1px 78px
        ),
        var(--paper);
    }

    a {
      color: inherit;
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: clamp(24px, 5vw, 48px);
    }

    .migration {
      width: min(100%, 1080px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .bar {
      height: 8px;
      background:
        linear-gradient(90deg, var(--teal), var(--gold), var(--coral), var(--teal));
      background-size: 240% 100%;
      animation: travel 3.2s linear infinite;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: clamp(28px, 5vw, 64px);
      padding: clamp(28px, 6vw, 68px);
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--teal-dark);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 11ch;
      margin: 40px 0px;
      font-size: clamp(1.6rem, 4vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .lede {
      max-width: 38rem;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1.02rem, 2vw, 1.2rem);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0 20px;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      background: var(--ink);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background-color 180ms ease;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--teal-dark);
      box-shadow: 0 12px 30px rgba(16, 100, 102, 0.22);
      transform: translateY(-2px);
    }

    .button:focus-visible,
    .plain-link:focus-visible {
      outline: 3px solid rgba(216, 168, 53, 0.55);
      outline-offset: 4px;
    }

    .arrow {
      width: 22px;
      height: 2px;
      position: relative;
      border-radius: 999px;
      background: currentColor;
    }

    .arrow::after {
      content: "";
      width: 8px;
      height: 8px;
      position: absolute;
      right: 0;
      top: 50%;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }

    .plain-link {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      border-radius: 999px;
      padding: 0 4px;
      color: var(--teal-dark);
      font-weight: 800;
      text-decoration-color: rgba(16, 100, 102, 0.35);
      text-underline-offset: 5px;
    }

    .route {
      display: grid;
      gap: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(251, 247, 239, 0.72);
    }

    .route-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .domain {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-weight: 750;
    }

    .domain strong {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: clamp(1.05rem, 3vw, 1.35rem);
    }

    .dot {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .domain.is-new .dot {
      border-color: var(--teal);
      background: var(--teal);
      box-shadow: 0 0 0 6px rgba(30, 138, 138, 0.13);
    }

    .route-line {
      position: relative;
      height: 58px;
      margin-left: 5px;
      border-left: 2px dashed rgba(24, 32, 47, 0.18);
    }

    .courier {
      width: 26px;
      height: 26px;
      position: absolute;
      left: -14px;
      top: 0;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 8px 18px rgba(216, 93, 70, 0.26);
      animation: descend 3.2s ease-in-out infinite;
    }

    .status {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .status strong {
      color: var(--ink);
    }

    noscript {
      display: block;
      margin-top: 18px;
      color: var(--coral);
      font-weight: 750;
    }

    @keyframes travel {
      from {
        background-position: 0% 50%;
      }

      to {
        background-position: 240% 50%;
      }
    }

    @keyframes descend {
      0%,
      12% {
        transform: translateY(0);
      }

      88%,
      100% {
        transform: translateY(58px);
      }
    }

    @media (max-width: 760px) {
      main {
        place-items: start center;
      }

      .content {
        grid-template-columns: 1fr;
      }

      h1 {
        max-width: 9ch;
      }

      .route {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    (() => {
      const oldHost = "dktpt44.github.io";
      const newHost = "dhurba.net";

      /*
       * Start with the visitor's complete existing URL.
       * This preserves the path, query string, and hash.
       */
      const destination = new URL(window.location.href);

      destination.protocol = "https:";
      destination.hostname = newHost;
      destination.port = "";

      window.addEventListener("DOMContentLoaded", () => {
        const links = document.querySelectorAll("[data-destination-link]");
        const destinationText = document.querySelector("[data-destination-text]");
        const status = document.querySelector("[data-redirect-status]");

        links.forEach((link) => {
          link.href = destination.href;
        });

        if (destinationText) {
          destinationText.textContent = destination.host;
        }

        if (window.location.hostname !== oldHost) {
          if (status) {
            status.textContent = "This preview is ready. The live old domain redirects automatically.";
          }
          return;
        }

        let seconds = 3;

        const tick = () => {
          if (status) {
            status.textContent = `Redirecting in ${seconds} second${seconds === 1 ? "" : "s"}.`;
          }

          if (seconds === 0) {
            window.location.replace(destination.href);
            return;
          }

          seconds -= 1;
          window.setTimeout(tick, 1000);
        };

        tick();
      });
    })();
  </script>
</head>

<body>
  <main>
    <section class="migration" aria-labelledby="page-title">
      <div class="bar" aria-hidden="true"></div>

      <div class="content">
        <div>
          <p class="eyebrow">Domain migration</p>
          <h1 id="page-title">This site has moved.</h1>

          <p class="lede">
            The portfolio and the blog now lives at <strong>dhurba.net</strong>. 
          </p>

          <div class="actions" aria-label="Migration actions">
            <a class="button" href="https://dhurba.net/" data-destination-link>
              Continue to dhurba.net
              <span class="arrow" aria-hidden="true"></span>
            </a>
          </div>

          <noscript>
            JavaScript is disabled. Use the link above to continue to dhurba.net.
          </noscript>
        </div>

        <aside class="route" aria-label="Redirect route">
          <p class="route-label">Redirect route</p>

          <div class="domain">
            <span class="dot" aria-hidden="true"></span>
            <strong>dktpt44.github.io</strong>
          </div>

          <div class="route-line" aria-hidden="true">
            <span class="courier"></span>
          </div>

          <div class="domain is-new">
            <span class="dot" aria-hidden="true"></span>
            <strong data-destination-text>dhurba.net</strong>
          </div>

          <p class="status">
            <strong>Ready:</strong>
            <span data-redirect-status>Preparing the new address.</span>
          </p>
        </aside>
      </div>
    </section>
  </main>
</body>

</html>
