<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="This site has moved to dhurba.net. You will be redirected to the new domain.">

  <title>Redirect to dhurba.net</title>

  <style>
    :root {
      --ink: #f6f8fb;
      --muted: #9aa7ba;
      --paper: #080b12;
      --panel: rgba(16, 22, 34, 0.9);
      --panel-soft: rgba(255, 255, 255, 0.045);
      --cyan: #4dd0e1;
      --blue: #6d8dff;
      --green: #5ee6a8;
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.2);
      --shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.5;
      background:
        linear-gradient(135deg, rgba(77, 208, 225, 0.1), transparent 28%),
        linear-gradient(225deg, rgba(109, 141, 255, 0.08), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 34%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.035) 0 1px,
          transparent 1px 96px
        ),
        var(--paper);
    }

    a {
      color: inherit;
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: clamp(24px, 5vw, 48px);
    }

    .migration {
      width: min(100%, 1080px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      outline: 1px solid rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
    }

    .bar {
      height: 4px;
      background:
        linear-gradient(90deg, var(--cyan), var(--blue), var(--green), var(--cyan));
      background-size: 240% 100%;
      animation: travel 3.2s linear infinite;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      gap: clamp(28px, 5vw, 64px);
      padding: clamp(28px, 6vw, 68px);
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--cyan);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 11ch;
      margin: 40px 0px;
      color: #fff;
      font-size: clamp(1.6rem, 4vw, 3.5rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .lede {
      max-width: 38rem;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1.02rem, 2vw, 1.2rem);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 20px;
      color: #071019;
      font-weight: 800;
      text-decoration: none;
      background: linear-gradient(135deg, var(--cyan), var(--green));
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    .button:hover,
    .button:focus-visible {
      box-shadow: 0 16px 34px rgba(77, 208, 225, 0.22);
      filter: brightness(1.04);
      transform: translateY(-2px);
    }

    .button:focus-visible,
    .plain-link:focus-visible {
      outline: 3px solid rgba(77, 208, 225, 0.36);
      outline-offset: 4px;
    }

    .arrow {
      width: 22px;
      height: 2px;
      position: relative;
      border-radius: 999px;
      background: currentColor;
    }

    .arrow::after {
      content: "";
      width: 8px;
      height: 8px;
      position: absolute;
      right: 0;
      top: 50%;
      border-top: 2px solid currentColor;
      border-right: 2px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }

    .plain-link {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      border-radius: 8px;
      padding: 0 4px;
      color: var(--cyan);
      font-weight: 800;
      text-decoration-color: rgba(77, 208, 225, 0.4);
      text-underline-offset: 5px;
    }

    .route {
      display: grid;
      gap: 18px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .route-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .domain {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-weight: 750;
    }

    .domain strong {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: clamp(1.05rem, 3vw, 1.35rem);
    }

    .dot {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .domain.is-new .dot {
      border-color: var(--green);
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(94, 230, 168, 0.12);
    }

    .route-line {
      position: relative;
      height: 58px;
      margin-left: 5px;
      border-left: 2px dashed var(--line-strong);
    }

    .courier {
      width: 26px;
      height: 26px;
      position: absolute;
      left: -14px;
      top: 0;
      border: 3px solid rgba(8, 11, 18, 0.94);
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 8px 24px rgba(77, 208, 225, 0.32);
      animation: descend 3.2s ease-in-out infinite;
    }

    .status {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .status strong {
      color: var(--ink);
    }

    noscript {
      display: block;
      margin-top: 18px;
      color: var(--cyan);
      font-weight: 750;
    }

    @keyframes travel {
      from {
        background-position: 0% 50%;
      }

      to {
        background-position: 240% 50%;
      }
    }

    @keyframes descend {
      0%,
      12% {
        transform: translateY(0);
      }

      88%,
      100% {
        transform: translateY(58px);
      }
    }

    @media (max-width: 760px) {
      main {
        place-items: start center;
      }

      .content {
        grid-template-columns: 1fr;
      }

      h1 {
        max-width: 9ch;
      }

      .route {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    (() => {
      const oldHost = "dktpt44.github.io";
      const newHost = "dhurba.net";

      /*
       * Start with the visitor's complete existing URL.
       * This preserves the path, query string, and hash.
       */
      const destination = new URL(window.location.href);

      destination.protocol = "https:";
      destination.hostname = newHost;
      destination.port = "";

      if (window.location.hostname === oldHost) {
        window.location.replace(destination.href);
        return;
      }

      window.addEventListener("DOMContentLoaded", () => {
        const links = document.querySelectorAll("[data-destination-link]");
        const destinationText = document.querySelector("[data-destination-text]");
        const status = document.querySelector("[data-redirect-status]");

        links.forEach((link) => {
          link.href = destination.href;
        });

        if (destinationText) {
          destinationText.textContent = destination.host;
        }

        if (status) {
          status.textContent = "This preview is ready. The live old domain redirects immediately.";
        }
      });
    })();
  </script>
</head>

<body>
  <main>
    <section class="migration" aria-labelledby="page-title">
      <div class="bar" aria-hidden="true"></div>

      <div class="content">
        <div>
          <p class="eyebrow">Domain migration</p>
          <h1 id="page-title">This site has moved.</h1>

          <p class="lede">
            The portfolio and blog now live at <strong>dhurba.net</strong>.
          </p>

          <div class="actions" aria-label="Migration actions">
            <a class="button" href="https://dhurba.net/" data-destination-link>
              Continue to dhurba.net
              <span class="arrow" aria-hidden="true"></span>
            </a>
          </div>

          <noscript>
            JavaScript is disabled. Use the link above to continue to dhurba.net.
          </noscript>
        </div>

        <aside class="route" aria-label="Redirect route">
          <p class="route-label">Redirect route</p>

          <div class="domain">
            <span class="dot" aria-hidden="true"></span>
            <strong>dktpt44.github.io</strong>
          </div>

          <div class="route-line" aria-hidden="true">
            <span class="courier"></span>
          </div>

          <div class="domain is-new">
            <span class="dot" aria-hidden="true"></span>
            <strong data-destination-text>dhurba.net</strong>
          </div>

          <p class="status">
            <strong>Ready:</strong>
            <span data-redirect-status>Preparing the new address.</span>
          </p>
        </aside>
      </div>
    </section>
  </main>
</body>

</html>
